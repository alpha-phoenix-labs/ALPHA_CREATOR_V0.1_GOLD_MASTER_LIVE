services:
  - type: web
    name: alpha-creator-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alpha-creator-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: alpha-creator-db
    plan: free
    databaseName: alpha_creator
    user: alpha_creator

